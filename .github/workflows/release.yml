name: release

# Build the release tarball from the tagged commit and attach it to a GitHub
# Release. A tag push (or a manual run) is enough; no local tooling needed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (e.g. v0.1.0)
        required: true

permissions:
  contents: write

env:
  BIN: revolinux

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag and version
        id: meta
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="${{ inputs.tag }}"
          fi
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          asset="${BIN}-${version}-x86_64-unknown-linux-gnu.tar.gz"
          test -n "$tag" && test -n "$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Build and install binary
        run: |
          sudo dnf install -y cargo rust gcc
          cargo build --release

      - name: Build tarball
        run: |
          mkdir -p "dist/${BIN}"
          install -m755 "target/release/${BIN}" "dist/${BIN}/${BIN}"
          cp assets/revolinux.svg assets/revolinux.desktop "dist/${BIN}/"
          install -m755 packaging/install-release.sh "dist/${BIN}/install.sh"
          tar -C dist -czf "dist/${{ steps.meta.outputs.asset }}" "${BIN}"
          (cd dist && sha256sum "${{ steps.meta.outputs.asset }}" \
             > "${{ steps.meta.outputs.asset }}.sha256")
          tar -tzvf "dist/${{ steps.meta.outputs.asset }}"
          ls -l dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ steps.meta.outputs.tag }}"
          asset="${{ steps.meta.outputs.asset }}"
          notes="Standalone Linux x86_64 build.

          Download the tarball, extract it, then run \`./install.sh\` (or
          \`PREFIX=\"\$HOME/.local\" ./install.sh\` without root)."
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "dist/$asset" "dist/$asset.sha256" --clobber
          else
            gh release create "$tag" "dist/$asset" "dist/$asset.sha256" \
              --title "RevoLinux ${{ steps.meta.outputs.version }}" \
              --notes "$notes"
          fi
